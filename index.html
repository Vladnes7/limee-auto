<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c0a">
<meta name="color-scheme" content="dark light">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
/* Page transition. Inline on purpose: Chrome decides whether to run a cross-document
   transition when the new page first renders; if the opt-in sat in the external stylesheet,
   phones often missed it ("ViewTransition opt-in disabled") and every other click had none. */
@view-transition { navigation: auto; }

/* The header is its own layer, so it stays put while the page under it changes. */
.site-header { view-transition-name: site-header; }
::view-transition-group(site-header) { z-index: 2; }
::view-transition-old(site-header) { display: none; }
::view-transition-new(site-header) { animation: none; }

/* Curtain: an ink panel with lime edges sweeps up, covers the old page, then uncovers the new one.
   It is the transition group of an invisible fixed element (.vt-curtain), painted here. */
.vt-curtain { position: fixed; inset: 0; z-index: -1; opacity: 0; pointer-events: none; view-transition-name: vt-curtain; }
::view-transition-group(vt-curtain) { z-index: 3; background: #0b0c0a; border-block: 4px solid #d5ff00; animation: vt-curtain 1s cubic-bezier(0.76, 0, 0.24, 1) both; }
::view-transition-old(vt-curtain), ::view-transition-new(vt-curtain) { animation: none; }
::view-transition-old(root) { animation: vt-old 1s cubic-bezier(0.76, 0, 0.24, 1) both; }
::view-transition-new(root) { animation: vt-new 1s cubic-bezier(0.22, 1, 0.36, 1) both; }
@keyframes vt-curtain {
  0% { transform: translateY(calc(100% + 8px)); }
  45%, 55% { transform: translateY(0); }
  100% { transform: translateY(calc(-100% - 8px)); }
}
@keyframes vt-old {
  45% { transform: translateY(-8vh) scale(0.97); opacity: 1; }
  46%, 100% { transform: translateY(-8vh) scale(0.97); opacity: 0; }
}
@keyframes vt-new {
  0%, 50% { opacity: 0; transform: translateY(10vh); }
  51% { opacity: 1; transform: translateY(10vh); }
  100% { transform: none; }
}
@media (prefers-reduced-motion: reduce) {
  ::view-transition-group(vt-curtain) { display: none; }
  ::view-transition-old(root), ::view-transition-new(root) { animation: none; }
}
</style>
<!--head-->
<link rel="stylesheet" href="/src/styles/index.css">
<script type="module" src="/src/main.js"></script>
</head>
<body>
<!--app-->
</body>
</html>
