# Limee Auto, демо-адрес на VPS: http://37.77.106.12:8083
# Статика из /var/www/limee-auto. Поисковикам закрыто (на реальном домене убрать X-Robots-Tag и собрать с SITE_INDEX=1).
server {
    listen 8083;
    listen [::]:8083;
    server_name _;

    root /var/www/limee-auto;
    index index.html;
    error_page 404 /404.html;

    add_header X-Robots-Tag "noindex, nofollow" always;

    # Страницы: браузер каждый раз сверяется с сервером (ETag, ответ 304 — доли секунды).
    # Без этого Chrome держал старую версию страницы часами после выкладки.
    location / {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Хэшированные файлы сборки и медиа не меняются под тем же именем.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Фото, карта, видео: файлы могут замениться под тем же именем (карта с Кореей, перекодированный фильм),
    # поэтому браузер сверяется с сервером (ETag), а не хранит 30 дней вслепую. Видео отдаётся диапазонами (Range).
    # Изменчивые файлы к тому же идут со штампом ?v=<md5> (render/ui.js ver()).
    location /media/ {
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json text/plain application/xml;
}
