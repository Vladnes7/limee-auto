# Limee Auto, демо-адрес на VPS: http://37.77.106.12:8084 (вариант Б: первый экран с фото Bentley)
# Статика из /var/www/limee-auto. Поисковикам закрыто (на реальном домене убрать X-Robots-Tag и собрать с SITE_INDEX=1).
server {
    listen 8084;
    listen [::]:8084;
    server_name _;

    root /var/www/limee-auto-b;
    index index.html;
    error_page 404 /404.html;

    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        try_files $uri $uri/index.html =404;
    }

    # Хэшированные файлы сборки и медиа не меняются под тем же именем.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Видео фильма: nginx отдаёт диапазоны (Range), поэтому перемотка работает.
    location /media/ {
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json text/plain application/xml;
}
